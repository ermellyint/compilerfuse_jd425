[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ermellyint-compilerfuse_jd425"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出编译器与算子融合专家·成本与吞吐的帕累托边界上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ermellyint" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ermellyint.github.io"
Repository = "https://github.com/ermellyint/compilerfuse_jd425"
Issues = "https://github.com/ermellyint/compilerfuse_jd425/issues"

[project.scripts]
compilerfuse_jd425 = "compilerfuse_jd425:main"

[tool.setuptools]
py-modules = ["compilerfuse_jd425"]
